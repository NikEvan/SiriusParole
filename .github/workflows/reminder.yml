name: Telegram - promemoria

# Invia il promemoria IN PRIVATO ai soli iscritti (comando /notifiche).
# Gli orari sono in UTC. In estate l'Italia e' UTC+2, in inverno UTC+1.
# Schedulati in anticipo perche' GitHub esegue i cron con ritardo.
#   23 10 UTC -> 12:23 italiane in estate (arriva verso le 12:30-13:30)
#   23 17 UTC -> 19:23 italiane in estate (arriva verso le 19:30-20:30)
# NOTA: a fine ottobre, col cambio d'ora, arriveranno un'ora prima:
#       per correggere basta aumentare di 1 l'ora dei due cron.
on:
  schedule:
    - cron: '23 10 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      fascia:
        description: "Quale promemoria inviare"
        required: true
        default: pranzo
        type: choice
        options:
          - pranzo
          - sera

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Invia promemoria
        env:
          MODE: promemoria
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FASCIA: ${{ github.event.inputs.fascia || github.event.schedule }}
          GAME_URL: https://nikevan.github.io/SiriusParole/
        run: python telegram_bot.py
